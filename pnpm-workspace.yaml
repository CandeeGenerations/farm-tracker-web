packages:
  - 'client'
  - 'server'
ignoreWorkspaceRootCheck: true
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  sharp: true
overrides:
  # Node types track the .nvmrc major (24); transitive @types/* ask for "*" and would pull a newer major.
  '@types/node': '>=24.19.0 <25.0.0'
  # Security: regenerated by CGENovate from a stripped audit; bounded to the patched major.
  body-parser: '>=2.3.0 <3.0.0'
  'brace-expansion@1': '>=1.1.21 <2.0.0'
  'brace-expansion@2': '>=2.1.7 <3.0.0'
  'brace-expansion@5': '>=5.0.12 <6.0.0'
  fast-uri: '>=3.1.8 <4.0.0'
  js-yaml: '>=4.3.2 <5.0.0'
  postcss-selector-parser: '>=6.1.3 <7.0.0'
  qs: '>=6.16.0 <7.0.0'
